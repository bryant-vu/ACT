{% extends 'layout.html' %}

{% block body %}
<h2>Lessons</h2>
<div class='container'>
    <center>
        <i>Topics and questions in the order they are taught.</i>
        <div id='lessonPicker'></div>
    </center>
</div>
<div class='row'>
    <div class="col-sm-12">
        <div id="lesson"></div>
    </div>
</div>
<br><br>
<style>
  #lessonPicker { margin: 15px 0 25px; }
  #lessonPicker button { margin: 4px; }
  #lessonPicker button.active { background: #2c3e50; background-image: none; }
  .lessonTopic { margin: 35px 0 10px; padding-bottom: 6px; border-bottom: 2px solid #ccc; }
  .lessonTopic small { color: #666; font-size: 70%; }
  .lessonNote { font-style: italic; color: #555; }
  /* each question fills at least a screen, so the next one stays out of view */
  .lessonQ { margin: 18px 0; min-height: 100vh; }
  .lessonQ img { max-width: 100%; display: block; margin-top: 8px; }
  .lessonExtra { border-left: 4px dashed #bbb; padding-left: 10px; }
</style>
<script src="{{ url_for('static', filename='js/lessons.js') }}"></script>
{% endblock %}
