{% extends 'layout.html' %}

{% block body %}
<h2>Homework</h2>
<div class='container'>
        <center>
            <div class='row'>
                <div class="col-sm-12">
                    <form method='post' action="javascript: getQuestionData()">
                        <h3>Select Homework Assignment(s)</h3>
                            <i>Notes:</i>
                            <br><i> *HW questions are nearly identical to those covered in class.</i>
                            <br><i> *Higher numbered questions are generally more difficult.</i>
                            <br><i> *Refer to your notes if you have trouble answering the questions.</i>
                            <div id='hwSearch'{% if not is_tutor %} style="display:none"{% endif %}>
                                <input type='search' id='nameSearch' placeholder='Type your name...' autocomplete='off'>
                            </div>
                            <div id='checkboxesTopics'></div>
                            <style>
                              #hwSearch { margin: 15px 0 10px; }
                              #nameSearch { width: 100%; max-width: 360px; padding: 8px 14px; font-size: 16px;
                                            border: 1px solid #ccc; border-radius: 20px; }
                              /* cards are as wide as their assignments need, and wrap onto new rows */
                              #checkboxesTopics { display: flex; flex-wrap: wrap; justify-content: center;
                                                  gap: 12px; margin-bottom: 20px; text-align: left; }
                              .hwGroup { padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; background: #f9f9f9;
                                         max-width: 100%; }
                              .hwGroup.groupClass { border-color: #2980b9; background: #eef6fc; }
                              .hwGroup h4 { font-size: 18px; margin: 0 0 6px; display: flex; justify-content: space-between;
                                            align-items: center; gap: 8px; }
                              .hwGroup h4 button { font-size: 12px; padding: 3px 10px; border: 0; border-radius: 12px;
                                                   background: #2980b9; color: #fff; cursor: pointer; white-space: nowrap; }
                              /* assignments run left to right and wrap, to save vertical space */
                              .hwGroup label { display: inline-block; margin: 2px 14px 2px 0; cursor: pointer; }
                              .hwGroup label input { margin-right: 6px; }
                              .hwNone { flex-basis: 100%; text-align: center; color: #777; font-style: italic; }
                            </style>
                        <div>
                        <input type='submit' value='Submit'>
                        </div>
                    </form>
                </div>
            </div>
        </center>
    </div>


        <br>
        <br>
        <br>


        <div class='row'>
            <h2 id="solve"></h2>
                <div class="col-sm-12">
                    <div id="question">

                    </div>
                </div>
        </div>

        <br>
        <br>
<script>
  // Homework should hit the CSV endpoints
  window.API_PREFIX = '/api/v1/homework';
</script>
<!-- Load Plotly first (it includes d3) -->
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<!-- Shared question rendering, then the page script that calls it -->
<script src="{{ url_for('static', filename='js/questions.js') }}"></script>
<script src="{{ url_for('static', filename='js/homework.js') }}"></script>
{% endblock %}
